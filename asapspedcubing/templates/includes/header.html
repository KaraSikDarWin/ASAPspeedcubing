<!-- header.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- Бренд / логотип -->
        <a class="navbar-brand" href="{% url 'meet:index' %}"> ASAP_speedcubing</a>
        
        <!-- Кнопка-гамбургер для мобильных устройств -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Ссылки навигации (складываются на маленьких экранах) -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"> <!-- ms-auto прижимает ссылки вправо -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'meet:index' %}">Главная</a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'competitors' %}active{% endif %}" href="{% url 'meet:competitors_list' %}">Участники</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'disciplines' %}active{% endif %}" href="{% url 'meet:disciplines_list' %}">Дисциплины</a>
                </li>
                {% endif %}
                {% if not user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}" href="{% url 'login' %}">🚪</a>
                </li>
                {% endif %}
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Выйти</button>
                    </form>
                </li>
                {% endif %}
                <!-- Добавьте другие пункты меню по необходимости -->
            </ul>
        </div>
    </div>
</nav>

<!-- Подключение JavaScript Bootstrap (для работы гамбургера) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
