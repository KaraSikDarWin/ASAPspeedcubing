{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <!-- Заголовок страницы -->
    <div class="d-flex justify-content-between align-items-center ">
        <h1 class="display-5">Участники</h1>
        {% if user.is_authenticated %}
        <div>
        <a href="{% url 'meet:competitors_create' %}" class="btn btn-success">
            + Добавить участника
        </a>
    </div>
        {% endif %}
    </div>

    <div class="container p-0">
        {% for comp in page_obj %}
        <div class='d-flex justify-content-between container-fluid align-items-center m-3 border border-primary p-3 rounded-pill'>
            
        <h5 class='m-0'>
            {{comp.name}} {{comp.surname}}
        </h5>
        <div class='m-0'>
            {% if user.is_authenticated %}
            <a class='border border-info rounded-circle p-1 text-decoration-none' href={% url 'meet:competitors_update' comp.id %}>✏️</a>
            <a class='border border-danger rounded-circle p-1 text-decoration-none' href={% url 'meet:competitors_delete' comp.id %}>🗑️</a>
            {% endif %}
        </div>
        
        </div>
        
        {% endfor %}
    </div>

</div>

{% include 'includes/paginator.html' %}
{% endblock %}
